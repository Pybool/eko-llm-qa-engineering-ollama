[project]
name = "llm-qa-engineering-lab"
version = "0.1.0"
description = "Practical lessons and QA test labs for understanding and testing LLM systems"
requires-python = ">=3.12,<3.14"
dependencies = [
  "requests>=2.34.2",
  "tiktoken>=0.9,<1",
]

[dependency-groups]
dev = [
  "deepeval>=4.2.9",
  "google-genai>=2.31.0",
  "litellm>=1.105.1",
  "ollama>=0.6.3",
  "openai>=2.54.0",
  "pytest>=8,<10",
  "python-dotenv>=1.2.4",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llmqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
